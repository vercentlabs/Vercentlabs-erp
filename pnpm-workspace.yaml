packages:
  - "apps/*"
  - "services/*"
  - "packages/*"

# The root advertises npm so Hostinger's pre-build dependency step does not
# invoke its broken Corepack pnpm cache. pnpm remains the workspace manager.
pmOnFail: ignore

virtualStoreDir: .pnpm
virtualStoreDirMaxLength: 30

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js-pure: true
  esbuild: true
  protobufjs: false
  sharp: true
  unrs-resolver: true

overrides:
  postcss: 8.5.23
  playwright: 1.61.1
  brace-expansion: 5.0.9
  sharp: 0.35.3
  xcode>uuid: 11.1.1

minimumReleaseAgeExclude:
  - "@expo/cli@57.0.10"
  - "@expo/config-plugins@57.0.6"
  - "@expo/config@57.0.6"
  - "@expo/fingerprint@0.20.6"
  - "@expo/image-utils@0.11.4"
  - "@expo/metro-config@57.0.7"
  - "@expo/metro-runtime@57.0.7"
  - "@expo/prebuild-config@57.0.9"
  - "@expo/require-utils@57.0.4"
  - "@expo/router-server@57.0.4"
  - babel-preset-expo@57.0.4
  - expo-asset@57.0.7
  - expo-constants@57.0.7
  - expo-linking@57.0.4
  - expo-local-authentication@57.0.2
  - expo-modules-autolinking@57.0.9
  - expo-modules-core@57.0.7
  - expo-modules-jsi@57.0.4
  - expo-router@57.0.8
  - expo-splash-screen@57.0.5
  - expo@57.0.8
  - brace-expansion@5.0.9
  - knip@6.37.0

patchedDependencies:
  brace-expansion@5.0.9: patches/brace-expansion@5.0.9.patch
