openapi: 3.1.0
info:
  title: Vercent ERP API
  version: 0.3.0
  description: Browser and native contracts for the released CRM platform.
servers:
  - url: https://erp.example.com/api
paths:
  /mobile/v1/health:
    get:
      summary: Check mobile API compatibility
      responses:
        "200":
          description: Mobile API is available
  /mobile/v1/auth/login:
    post:
      summary: Create a device-bound mobile session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileLoginRequest"
      responses:
        "200":
          description: Access and refresh tokens issued
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /mobile/v1/auth/refresh:
    post:
      summary: Rotate a mobile access and refresh token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Token pair rotated
        "401":
          $ref: "#/components/responses/Problem"
  /mobile/v1/auth/logout:
    post:
      summary: Revoke the current mobile session
      security:
        - mobileBearer: []
      responses:
        "200":
          description: Session revoked
  /mobile/v1/session:
    get:
      summary: Read the user, workspace and permission context
      security:
        - mobileBearer: []
      responses:
        "200":
          description: Current session context
        "401":
          $ref: "#/components/responses/Problem"
  /approvals:
    get:
      summary: List approval requests assigned to the current user
      responses:
        "200":
          description: Approval request list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalListResponse"
    post:
      summary: Create a command-bound approval request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApprovalRequest"
      responses:
        "201":
          description: Approval request created
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /approvals/{id}:
    parameters:
      - $ref: "#/components/parameters/Identifier"
    get:
      summary: Read an approval request
      responses:
        "200":
          description: Approval request
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      summary: Approve or reject a command-bound request
      description: Uses optimistic locking and separation of duties. Approved commands execute in the same database transaction as the decision and audit record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecision"
      responses:
        "200":
          description: Decision committed
        "409":
          $ref: "#/components/responses/Problem"
  /crm/opportunities/{id}/stage:
    parameters:
      - $ref: "#/components/parameters/Identifier"
    post:
      summary: Move an opportunity to another active pipeline stage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [stageId]
              properties:
                stageId:
                  type: string
                  format: uuid
                note:
                  type: string
                  maxLength: 1000
      responses:
        "200":
          description: Opportunity updated
        "409":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    mobileBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    Identifier:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    MobileLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, device]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        device:
          type: object
          additionalProperties: false
          required: [deviceId, platform, deviceName, appVersion]
          properties:
            deviceId:
              type: string
              format: uuid
            platform:
              type: string
              enum: [android, ios]
            deviceName:
              type: string
              maxLength: 120
            appVersion:
              type: string
              maxLength: 40
    CreateApprovalRequest:
      type: object
      additionalProperties: false
      required: [commandKey, commandPayload]
      properties:
        commandKey:
          type: string
          enum: [crm.opportunity.stage_change, crm.activity.complete]
        commandPayload:
          type: object
        assignedTo:
          type: [string, "null"]
          format: uuid
    ApprovalDecision:
      type: object
      additionalProperties: false
      required: [action, expectedVersion]
      properties:
        action:
          type: string
          enum: [approve, reject]
        note:
          type: string
          maxLength: 1000
        expectedVersion:
          type: integer
          minimum: 1
    ApprovalListResponse:
      type: object
      required: [ok, requests]
      properties:
        ok:
          const: true
        requests:
          type: array
          items:
            type: object
    Problem:
      type: object
      required: [ok, message]
      properties:
        ok:
          const: false
        message:
          type: string
  responses:
    Problem:
      description: Request rejected
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
