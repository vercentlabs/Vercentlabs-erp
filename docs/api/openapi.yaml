openapi: 3.1.0
info:
  title: Vercentlabs ERP API
  version: 0.4.0
  description: Partial internal browser and native contracts for selected controlled early-access CRM, Sales, Accounting and Procurement workflows. This is not yet the complete supported public API.
servers:
  - url: https://erp.example.com/api
paths:
  /mobile/v1/health:
    get:
      summary: Check mobile API compatibility
      responses:
        "200":
          description: Mobile API is available
  /mobile/v1/auth/login:
    post:
      summary: Create a device-bound mobile session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileLoginRequest"
      responses:
        "200":
          description: Access and refresh tokens issued
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /mobile/v1/auth/refresh:
    post:
      summary: Rotate a mobile access and refresh token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Token pair rotated
        "401":
          $ref: "#/components/responses/Problem"
  /mobile/v1/auth/logout:
    post:
      summary: Revoke the current mobile session
      security:
        - mobileBearer: []
      responses:
        "200":
          description: Session revoked
  /mobile/v1/session:
    get:
      summary: Read the user, workspace and permission context
      security:
        - mobileBearer: []
      responses:
        "200":
          description: Current session context
        "401":
          $ref: "#/components/responses/Problem"
  /approvals:
    get:
      summary: List approval requests assigned to the current user
      responses:
        "200":
          description: Approval request list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalListResponse"
    post:
      summary: Create a command-bound approval request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApprovalRequest"
      responses:
        "201":
          description: Approval request created
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /approvals/{id}:
    parameters:
      - $ref: "#/components/parameters/Identifier"
    get:
      summary: Read an approval request
      responses:
        "200":
          description: Approval request
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      summary: Approve or reject a command-bound request
      description: Uses optimistic locking and separation of duties. Approved commands execute in the same database transaction as the decision and audit record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecision"
      responses:
        "200":
          description: Decision committed
        "409":
          $ref: "#/components/responses/Problem"
  /crm/opportunities/{id}/stage:
    parameters:
      - $ref: "#/components/parameters/Identifier"
    post:
      summary: Move an opportunity to another active pipeline stage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [stageId]
              properties:
                stageId:
                  type: string
                  format: uuid
                note:
                  type: string
                  maxLength: 1000
      responses:
        "200":
          description: Opportunity updated
        "409":
          $ref: "#/components/responses/Problem"
  /procurement/resources/{resource}:
    parameters:
      - name: resource
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List a permission-scoped Procurement resource
      responses:
        "200":
          description: Resource rows and total count
    post:
      summary: Create a governed Procurement record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Procurement record created
        "409":
          $ref: "#/components/responses/Problem"
  /procurement/resources/{resource}/{id}:
    parameters:
      - name: resource
        in: path
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/Identifier"
    get:
      summary: Read a Procurement record with child evidence
      responses:
        "200":
          description: Procurement record
    patch:
      summary: Update a draft or otherwise editable Procurement record
      responses:
        "200":
          description: Procurement record updated
  /procurement/matching/run:
    post:
      summary: Run two-way, three-way or four-way supplier-invoice matching
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcurementMatchRequest"
      responses:
        "201":
          description: Match record and optional exception created
        "409":
          $ref: "#/components/responses/Problem"
  /accounting/payables/procurement-matches/{id}/import:
    parameters:
      - $ref: "#/components/parameters/Identifier"
    post:
      summary: Create an idempotent draft vendor bill from a matched Procurement invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcurementVendorBillImport"
      responses:
        "201":
          description: Vendor bill created or the existing imported bill returned
        "409":
          $ref: "#/components/responses/Problem"
  /sales/orders/{id}/actions:
    parameters:
      - $ref: "#/components/parameters/Identifier"
    post:
      summary: Execute a governed sales-order action, amendment or fulfilment completion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required: [action]
              properties:
                action:
                  type: string
                  enum:
                    [
                      confirm,
                      hold,
                      release_hold,
                      cancel,
                      amend,
                      complete_fulfillment,
                    ]
      responses:
        "200":
          description: Updated sales order
        "409":
          $ref: "#/components/responses/Problem"
  /release/governance:
    get:
      summary: Read enterprise release readiness, latest checks and incidents
      responses:
        "200":
          description: Organisation-scoped release governance dashboard
        "403":
          $ref: "#/components/responses/Problem"
    post:
      summary: Record a check, capture a readiness snapshot or manage a release incident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [record-check, capture-snapshot, upsert-incident]
                check:
                  type: object
                snapshot:
                  type: object
                incident:
                  type: object
      responses:
        "200":
          description: Release governance action committed
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /release/governance/timeline:
    get:
      summary: Read release checks, incidents and snapshots as a unified timeline
      responses:
        "200":
          description: Organisation-scoped release governance timeline
        "403":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    mobileBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    Identifier:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ProcurementLine:
      type: object
      additionalProperties: true
      required: [description, quantity, unitPrice]
      properties:
        purchaseOrderLineId:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        uomId:
          type: string
          format: uuid
        description:
          type: string
          maxLength: 1000
        quantity:
          oneOf:
            - type: string
            - type: number
        unitPrice:
          oneOf:
            - type: string
            - type: number
        taxAmount:
          oneOf:
            - type: string
            - type: number
    ProcurementMatchRequest:
      type: object
      additionalProperties: false
      required: [purchaseOrderId, invoiceNumber, invoiceLines]
      properties:
        purchaseOrderId:
          type: string
          format: uuid
        sourceGoodsReceiptId:
          type: string
          format: uuid
        invoiceNumber:
          type: string
          maxLength: 100
        matchMode:
          type: string
          enum: [two-way, three-way, four-way]
          default: three-way
        tolerancePercent:
          type: number
          minimum: 0
          maximum: 100
        invoiceLines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ProcurementLine"
    ProcurementVendorBillImport:
      type: object
      additionalProperties: false
      properties:
        partyId:
          type: string
          format: uuid
        sourceGoodsReceiptId:
          type: string
          format: uuid
        billDate:
          type: string
          format: date
        accountingDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
        exchangeRate:
          oneOf:
            - type: string
            - type: number
        notes:
          type: string
          maxLength: 2000
    MobileLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, device]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        device:
          type: object
          additionalProperties: false
          required: [deviceId, platform, deviceName, appVersion]
          properties:
            deviceId:
              type: string
              format: uuid
            platform:
              type: string
              enum: [android, ios]
            deviceName:
              type: string
              maxLength: 120
            appVersion:
              type: string
              maxLength: 40
    CreateApprovalRequest:
      type: object
      additionalProperties: false
      required: [commandKey, commandPayload]
      properties:
        commandKey:
          type: string
          enum: [crm.opportunity.stage_change, crm.activity.complete]
        commandPayload:
          type: object
        assignedTo:
          type: [string, "null"]
          format: uuid
    ApprovalDecision:
      type: object
      additionalProperties: false
      required: [action, expectedVersion]
      properties:
        action:
          type: string
          enum: [approve, reject]
        note:
          type: string
          maxLength: 1000
        expectedVersion:
          type: integer
          minimum: 1
    ApprovalListResponse:
      type: object
      required: [ok, requests]
      properties:
        ok:
          const: true
        requests:
          type: array
          items:
            type: object
    Problem:
      type: object
      required: [ok, message]
      properties:
        ok:
          const: false
        message:
          type: string
  responses:
    Problem:
      description: Request rejected
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
