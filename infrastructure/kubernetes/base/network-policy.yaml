apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: vercentlabs
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-http-ingress
  namespace: vercentlabs
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [vercentlabs-web, vercentlabs-landing] }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: 3000 }
        - { protocol: TCP, port: 3001 }
