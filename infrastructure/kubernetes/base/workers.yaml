apiVersion: batch/v1
kind: CronJob
metadata:
  name: crm-jobs
  namespace: vercent
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: worker
              image: ghcr.io/vercentlabs/erp-worker:latest
              command: [node, scripts/process-crm-jobs.mjs]
              envFrom:
                - configMapRef: { name: vercent-runtime }
                - secretRef: { name: vercent-runtime }
              resources:
                requests: { cpu: 100m, memory: 192Mi }
                limits: { cpu: 500m, memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
---
