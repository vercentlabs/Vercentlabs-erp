# Secret Manager -> files, through the GKE Secret Manager add-on
# (secrets-store-gke.csi.k8s.io). Each workload sees only its own secrets
# (and its Google service account can read only those: terraform/secrets.tf).
# Files are named after the environment variable they feed (NAME_FILE).
# "latest" is resolved when the pod starts: a rotated secret takes effect on
# the next rollout (docs/operations/PRODUCTION_RUNBOOK.md#secret-rotation).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: web-secrets
  namespace: vercentlabs
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/${SECRET_PREFIX}-database-url-web/versions/latest"
        path: "DATABASE_URL"
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/${SECRET_PREFIX}-smtp-password/versions/latest"
        path: "SMTP_PASSWORD"
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/${SECRET_PREFIX}-razorpay-key-secret/versions/latest"
        path: "RAZORPAY_KEY_SECRET"
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/${SECRET_PREFIX}-razorpay-webhook-secret/versions/latest"
        path: "RAZORPAY_WEBHOOK_SECRET"
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/${SECRET_PREFIX}-attachment-scan-token/versions/latest"
        path: "ATTACHMENT_SCAN_TOKEN"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: worker-secrets
  namespace: vercentlabs
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/${SECRET_PREFIX}-database-url-worker/versions/latest"
        path: "WORKER_DATABASE_URL"
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/${SECRET_PREFIX}-smtp-password/versions/latest"
        path: "SMTP_PASSWORD"
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/${SECRET_PREFIX}-razorpay-key-secret/versions/latest"
        path: "RAZORPAY_KEY_SECRET"
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/${SECRET_PREFIX}-attachment-scan-token/versions/latest"
        path: "ATTACHMENT_SCAN_TOKEN"
