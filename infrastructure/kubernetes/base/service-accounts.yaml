# One Kubernetes service account per workload, each mapped to its own
# least-privilege Google service account through GKE Workload Identity
# (infrastructure/terraform/iam.tf). No service-account keys anywhere.
# The Kubernetes API token is not mounted: no workload talks to the API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  namespace: vercentlabs
  annotations:
    iam.gke.io/gcp-service-account: ${WEB_GSA}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: erp-worker
  namespace: vercentlabs
  annotations:
    iam.gke.io/gcp-service-account: ${WORKER_GSA}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migration
  namespace: vercentlabs
  annotations:
    iam.gke.io/gcp-service-account: ${MIGRATION_GSA}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: landing
  namespace: vercentlabs
  annotations:
    iam.gke.io/gcp-service-account: ${LANDING_GSA}
automountServiceAccountToken: false
