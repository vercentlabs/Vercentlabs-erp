apiVersion: v1
kind: ConfigMap
metadata:
  name: vercent-runtime
  namespace: vercent
data:
  NODE_ENV: production
  DATABASE_POOL_MAX: "12"
  DATABASE_IDLE_TIMEOUT_MS: "30000"
  DATABASE_CONNECTION_TIMEOUT_MS: "5000"
  DATABASE_STATEMENT_TIMEOUT_MS: "15000"
  DATABASE_QUERY_TIMEOUT_MS: "20000"
  CRM_OUTBOX_BATCH_SIZE: "25"
  CRM_OUTBOX_MAX_ATTEMPTS: "5"
  CRM_OUTBOX_LEASE_SECONDS: "300"
