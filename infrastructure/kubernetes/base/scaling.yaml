# Web autoscaling is bounded by the Cloud SQL connection budget, not only by
# CPU: (maxReplicas + 1 surge) x DATABASE_POOL_MAX must fit the budget
# checked in infrastructure/terraform/sql.tf. Overlays set the numbers.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: vercentlabs
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: web }
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: landing
  namespace: vercentlabs
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: landing }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: vercentlabs
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: vercentlabs-web }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: landing
  namespace: vercentlabs
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: vercentlabs-landing }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: erp-worker
  namespace: vercentlabs
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app: erp-worker }
