# Long-running ERP workloads. Rendered per environment by
# scripts/deploy/render-manifests.mjs (overlays/<environment> + deploy
# values); ${...} placeholders are never applied unrendered.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - service-accounts.yaml
  - configmap.yaml
  - secret-provider-classes.yaml
  - web.yaml
  - worker.yaml
  - landing.yaml
  - scaling.yaml
  - network-policy.yaml
  - ingress.yaml
