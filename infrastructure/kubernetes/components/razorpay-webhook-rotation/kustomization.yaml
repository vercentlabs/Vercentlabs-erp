# Accept the previous Razorpay webhook secret while rotating (web only). Remove after rotation.
# Enable in an overlay only after the Secret Manager secret(s) have a version.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - secret-provider-class.yaml
patches:
  - target: { kind: Deployment, name: web }
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: razorpay-webhook-rotation
          csi: { driver: secrets-store-gke.csi.k8s.io, readOnly: true, volumeAttributes: { secretProviderClass: razorpay-webhook-rotation-secrets } }
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: { name: razorpay-webhook-rotation, mountPath: /var/run/secrets/vercentlabs-razorpay-webhook-rotation, readOnly: true }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: RAZORPAY_WEBHOOK_SECRET_PREVIOUS_FILE, value: /var/run/secrets/vercentlabs-razorpay-webhook-rotation/RAZORPAY_WEBHOOK_SECRET_PREVIOUS }
