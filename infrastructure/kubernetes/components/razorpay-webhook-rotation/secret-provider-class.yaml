apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: razorpay-webhook-rotation-secrets
  namespace: vercentlabs
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/${SECRET_PREFIX}-razorpay-webhook-secret-previous/versions/latest"
        path: "RAZORPAY_WEBHOOK_SECRET_PREVIOUS"
