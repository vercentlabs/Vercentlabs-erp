# Microsoft OAuth connected accounts (web + worker token refresh).
# Enable in an overlay only after the Secret Manager secret(s) have a version.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - secret-provider-class.yaml
patches:
  - target: { kind: Deployment, name: web }
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: microsoft-oauth
          csi: { driver: secrets-store-gke.csi.k8s.io, readOnly: true, volumeAttributes: { secretProviderClass: microsoft-oauth-secrets } }
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: { name: microsoft-oauth, mountPath: /var/run/secrets/vercentlabs-microsoft-oauth, readOnly: true }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: MICROSOFT_OAUTH_CLIENT_SECRET_FILE, value: /var/run/secrets/vercentlabs-microsoft-oauth/MICROSOFT_OAUTH_CLIENT_SECRET }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: MICROSOFT_OAUTH_CLIENT_ID, value: "${MICROSOFT_OAUTH_CLIENT_ID}" }
  - target: { kind: Deployment, name: erp-worker }
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: microsoft-oauth
          csi: { driver: secrets-store-gke.csi.k8s.io, readOnly: true, volumeAttributes: { secretProviderClass: microsoft-oauth-secrets } }
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: { name: microsoft-oauth, mountPath: /var/run/secrets/vercentlabs-microsoft-oauth, readOnly: true }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: MICROSOFT_OAUTH_CLIENT_SECRET_FILE, value: /var/run/secrets/vercentlabs-microsoft-oauth/MICROSOFT_OAUTH_CLIENT_SECRET }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: MICROSOFT_OAUTH_CLIENT_ID, value: "${MICROSOFT_OAUTH_CLIENT_ID}" }
