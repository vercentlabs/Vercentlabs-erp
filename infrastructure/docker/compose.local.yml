services:
  postgres:
    image: postgres:16-alpine
    container_name: vercentlabs-postgres
    environment:
      POSTGRES_USER: vercentlabs
      POSTGRES_PASSWORD: vercentlabs_local_password
      POSTGRES_DB: vercentlabs_control
    ports:
      - "5433:5432"
    volumes:
      - vercentlabs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vercentlabs -d vercentlabs_control"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  vercentlabs_postgres_data:
