# Builds the four release images (web, worker, landing, migration) from the repo root and pushes them to Artifact Registry.
# Run by deploy.sh: gcloud builds submit --config infrastructure/cloudrun/cloudbuild.yaml --substitutions=...
# The Dockerfiles use BuildKit cache mounts, so BuildKit is switched on for every step.
substitutions:
  _REGION: asia-south1
  _REPOSITORY: vercentlabs
  _TAG: latest
  _SITE_URL: https://vercentlabs.com
  _APP_URL: https://app.vercentlabs.com

# The default build machine: a new project may not use the larger ones yet (quota). The images build one after another so a
# Next.js build never shares the machine's memory with another.
options:
  env:
    - DOCKER_BUILDKIT=1
  logging: CLOUD_LOGGING_ONLY

timeout: 7200s

steps:
  - id: web
    name: gcr.io/cloud-builders/docker
    args: [build, -f, infrastructure/docker/Dockerfile.web, --build-arg, GIT_SHA=$_TAG,
      -t, $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/web:$_TAG, .]
  - id: worker
    name: gcr.io/cloud-builders/docker
    args: [build, -f, infrastructure/docker/Dockerfile.worker, --build-arg, GIT_SHA=$_TAG,
      -t, $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/worker:$_TAG, .]
  - id: migration
    name: gcr.io/cloud-builders/docker
    args: [build, -f, infrastructure/docker/Dockerfile.migration, --build-arg, GIT_SHA=$_TAG,
      -t, $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/migration:$_TAG, .]
  - id: landing
    name: gcr.io/cloud-builders/docker
    args: [build, -f, infrastructure/docker/Dockerfile.landing, --build-arg, GIT_SHA=$_TAG,
      --build-arg, NEXT_PUBLIC_SITE_URL=$_SITE_URL, --build-arg, NEXT_PUBLIC_APP_URL=$_APP_URL,
      -t, $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/landing:$_TAG, .]

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/web:$_TAG
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/worker:$_TAG
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/migration:$_TAG
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/landing:$_TAG
