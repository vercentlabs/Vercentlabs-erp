name: Landing Release Verification

# Lighthouse baseline against the production standalone build. Deliberately
# NOT run on every PR (that's landing-ci.yml's job) — this runs on manual
# trigger (before a real release) and weekly.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC

# Least-privilege default — same as landing-ci.yml.
permissions:
  contents: read

jobs:
  full-verification:
    name: Production build + Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      # Install pinned pnpm directly so CI does not depend on Corepack's
      # interpretation of the npm packageManager field used by Hostinger.
      - name: Set up Node and pnpm
        uses: pnpm/setup@v1
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production build
        run: pnpm build:landing

      - name: Lighthouse baseline
        working-directory: apps/landing
        run: |
          node scripts/prepare-standalone.mjs
          node .next/standalone/apps/landing/server.js &
          sleep 5
          LIGHTHOUSE_BASE_URL=http://localhost:3000 LIGHTHOUSE_LABEL=ci node scripts/lighthouse-baseline.mjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: apps/landing/.lighthouse-reports/
          retention-days: 30
