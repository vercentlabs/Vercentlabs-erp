name: ERP CI

# Gate for the authenticated ERP product (web + mobile) — distinct from
# landing-ci.yml (public marketing site): typecheck, lint, route contracts,
# production build and dependency audit.
on:
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/mobile/**"
      - "services/api/**"
      - "services/worker/**"
      - "packages/**"
      - "database/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/erp-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/mobile/**"
      - "services/api/**"
      - "services/worker/**"
      - "packages/**"
      - "database/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/erp-ci.yml"
  # The deploy workflow runs this whole gate before building release images.
  workflow_call:
  # Also on demand (e.g. to gate a specific commit on main).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  erp-verification:
    name: Typecheck, lint, route contracts, build, dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      # Install pinned pnpm directly so CI does not depend on Corepack's
      # interpretation of the npm packageManager field used by Hostinger.
      - name: Set up Node and pnpm
        uses: pnpm/setup@v1
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Web typecheck
        run: pnpm typecheck:web

      - name: Web lint
        run: pnpm lint:web

      - name: Route contract verification
        run: pnpm verify:routes

      - name: Mobile typecheck + lint
        run: pnpm verify:mobile

      - name: Production ERP web build
        run: pnpm build:web

      - name: Dependency audit
        run: pnpm audit:dependencies
