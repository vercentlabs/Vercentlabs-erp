name: Landing CI

# Scoped to apps/landing and its content package — this monorepo also
# contains apps/web, apps/mobile, and services/api, out of this workflow's
# scope.
# Path filters keep this from running on unrelated changes.
on:
  pull_request:
    paths:
      - "apps/landing/**"
      - "packages/landing-content/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/landing-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - "packages/landing-content/**"

# Least-privilege default — never inherit the repo/org default
# GITHUB_TOKEN scope. No step here needs more than read access to repo
# contents (no write step, no secrets.* usage exists in this workflow).
permissions:
  contents: read

# Required PR checks: fast, deterministic, run on every push. Lighthouse
# runs in the scheduled landing-release-verification.yml instead.
jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # Install pinned pnpm directly so CI does not depend on Corepack's
      # interpretation of the npm packageManager field used by Hostinger.
      - name: Set up Node and pnpm
        uses: pnpm/setup@v1
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:landing

      - name: Typecheck
        run: pnpm typecheck:landing

      - name: Production build
        run: pnpm build:landing
