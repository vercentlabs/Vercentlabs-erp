name: CRM CI (backend/domain)

# Scoped to CRM backend/domain verification only. The CRM web frontend does
# not exist yet in the clean-slate rebuild (see docs/frontend-rebuild/README.md
# and docs/ux/UI_REWRITE_TRACKER.md) — this workflow does not pretend it
# does. When the CRM golden reference lands (planned at apps/web/src/app/
# (workspace)/crm/** and apps/web/src/features/crm/**, per the rebuild
# brief), add those paths back to the trigger list below and add real
# frontend verification steps (typecheck/lint/test/build/E2E) to the job —
# do not silently resurrect the old apps/web/src/app/(app)/crm/** /
# apps/web/src/modules/crm/** paths, that architecture is retired.
on:
  pull_request:
    paths:
      - "apps/mobile/src/**/crm/**"
      - "services/api/src/modules/crm/**"
      - "services/api/tests/crm*"
      - "services/api/src/modules/sales/index.js"
      - "services/api/src/modules/accounting/receivables.js"
      - "apps/web/src/app/api/notifications/**"
      - "services/worker/src/**crm**"
      - "database/**/migrations/**crm**"
      - "packages/permissions/**"
      - "packages/shared-types/**"
      - "scripts/validation/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/crm-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/api/src/modules/crm/**"
      - "database/**/migrations/**crm**"
      - ".github/workflows/crm-ci.yml"

permissions:
  contents: read

concurrency:
  group: crm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crm-backend-verification:
    name: CRM backend/domain (architecture, DB structure, module contracts, CRM tests, full API suite)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The CRM RBAC access matrix (services/api/tests/crm-access-matrix-db.test.mjs)
    # needs a real PostgreSQL: scope rules are SQL and mocks cannot prove them.
    # CRM_ACCESS_DB_REQUIRED=1 makes a missing database a FAILURE, never a
    # silent skip. The test seeds and rolls back its own organisation.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vercentlabs
          POSTGRES_PASSWORD: ci_owner_password
          POSTGRES_DB: vercentlabs_control
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U vercentlabs -d vercentlabs_control"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MIGRATION_DATABASE_URL: postgresql://vercentlabs:ci_owner_password@localhost:5433/vercentlabs_control
      DATABASE_URL: postgresql://vercent_app:ci_app_password@localhost:5433/vercentlabs_control
      DATABASE_SSL: "false"
      CRM_ACCESS_DB_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v6

      # Install pinned pnpm directly so CI does not depend on Corepack's
      # interpretation of the npm packageManager field used by Hostinger.
      - name: Set up Node and pnpm
        uses: pnpm/setup@v1
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations and provision the runtime role
        run: pnpm db:setup
      - name: Verify CRM backend/domain (includes the real-database RBAC matrix)
        run: pnpm verify:crm
      - name: Dependency audit
        run: pnpm audit:dependencies
