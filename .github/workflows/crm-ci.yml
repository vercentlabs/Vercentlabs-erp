name: CRM CI (backend/domain)

# Scoped to CRM backend/domain verification only. The CRM web frontend does
# not exist yet in the clean-slate rebuild (see docs/frontend-rebuild/README.md
# and docs/ux/UI_REWRITE_TRACKER.md) — this workflow does not pretend it
# does. When the CRM golden reference lands (planned at apps/web/src/app/
# (workspace)/crm/** and apps/web/src/features/crm/**, per the rebuild
# brief), add those paths back to the trigger list below and add real
# frontend verification steps (typecheck/lint/test/build/E2E) to the job —
# do not silently resurrect the old apps/web/src/app/(app)/crm/** /
# apps/web/src/modules/crm/** paths, that architecture is retired.
on:
  pull_request:
    paths:
      - "apps/mobile/src/**/crm/**"
      - "services/api/src/modules/crm/**"
      - "services/api/tests/crm*"
      - "services/worker/src/**crm**"
      - "database/**/migrations/**crm**"
      - "packages/permissions/**"
      - "packages/shared-types/**"
      - "scripts/validation/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/crm-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/api/src/modules/crm/**"
      - "database/**/migrations/**crm**"
      - ".github/workflows/crm-ci.yml"

permissions:
  contents: read

concurrency:
  group: crm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crm-backend-verification:
    name: CRM backend/domain (architecture, DB structure, module contracts, CRM tests, full API suite)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Must run before actions/setup-node@v4: that action's `cache: pnpm`
      # needs `pnpm` resolvable on PATH to key its cache, which fails
      # ("Unable to locate executable file: pnpm") unless corepack has
      # already shimmed it in. See landing-ci.yml's identical comment.
      - name: Enable Corepack
        run: corepack enable

      - name: Activate repository pnpm
        run: corepack prepare pnpm@11.21.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify CRM backend/domain
        run: pnpm verify:crm
      - name: Dependency audit
        run: pnpm audit:dependencies
