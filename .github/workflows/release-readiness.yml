name: ERP release readiness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vercentlabs
          POSTGRES_PASSWORD: vercentlabs_ci_password
          POSTGRES_DB: vercentlabs_control
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U vercentlabs -d vercentlabs_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_URL: http://localhost:3001
      DATABASE_URL: postgresql://vercentlabs:vercentlabs_ci_password@localhost:5433/vercentlabs_control
      MIGRATION_DATABASE_URL: postgresql://vercentlabs:vercentlabs_ci_password@localhost:5433/vercentlabs_control
      APP_DATABASE_ROLE: vercentlabs_app_ci
      APP_DATABASE_PASSWORD: vercentlabs_ci_runtime_password_2026
      FORM_ALLOWED_ORIGINS: http://localhost:3001
      BILLING_CHECKOUT_ENABLED: "false"
      BILLING_ENFORCEMENT_MODE: observe
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vercentlabs/landing exec playwright install --with-deps chromium
      - run: pnpm audit:dependencies
      - run: pnpm test:all
      - run: pnpm verify:release
      - run: pnpm db:migrate:control
      - run: pnpm db:migrate:tenant
      - run: pnpm db:provision:runtime-role
      - name: Switch verification to the restricted runtime role
        run: |
          echo "DATABASE_URL=postgresql://vercentlabs_app_ci:vercentlabs_ci_runtime_password_2026@localhost:5433/vercentlabs_control" >> "$GITHUB_ENV"
          echo "ENFORCE_RESTRICTED_DB_ROLE=true" >> "$GITHUB_ENV"
      - run: pnpm db:verify:control
      - run: pnpm db:verify:tenant
      - run: pnpm db:verify:crm
      - run: pnpm db:verify:sales
      - run: pnpm db:verify:accounting
      - run: pnpm db:verify:procurement
      - run: pnpm db:verify:billing
      - run: pnpm test:platform-live
      - run: pnpm format:check
      - run: pnpm lint:landing && pnpm typecheck:landing && pnpm build:landing
      - run: pnpm test:landing:e2e
      - run: pnpm test:landing:browser
      - run: pnpm lint:web && pnpm typecheck:web && pnpm build:web
      - run: pnpm lint:mobile && pnpm typecheck:mobile
